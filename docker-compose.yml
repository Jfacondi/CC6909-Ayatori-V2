services:
  ayatori:
    build: .
    image: ayatori-api:dev
    container_name: ayatori-api
    ports:
      - "8000:8000"
    volumes:
      # Datos GTFS y cache de transferencias persisten fuera de la imagen.
      - ./ayatori/data:/app/ayatori/data
    environment:
      AYATORI_GTFS_PATH: ayatori/data/GTFS/2023-09-16/GTFS-V100-PO20230916.zip
      AYATORI_TRANSFERS_CACHE: ayatori/data/cache/transfers.json
      AYATORI_TRANSFERS_MAX_DIST_KM: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
