<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ayatori — Simulador de viajes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --good: #4ade80;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                 background: var(--bg); color: var(--text); }
    #app { display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
    aside { background: var(--panel); overflow-y: auto; padding: 16px; border-right: 1px solid #0b1224; }
    main  { position: relative; }
    #map  { width: 100%; height: 100%; }
    h1 { font-size: 18px; margin: 0 0 6px 0; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
         margin: 18px 0 8px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-top: 8px; }
    input[type="text"], input[type="datetime-local"], input[type="number"], select {
      width: 100%; background: var(--panel-2); color: var(--text);
      border: 1px solid #475569; border-radius: 6px; padding: 6px 8px; font-size: 13px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .slider-row { display: grid; grid-template-columns: 1fr 60px; gap: 8px; align-items: center; }
    .slider-row input[type="range"] { width: 100%; }
    .slider-row span { font-size: 12px; color: var(--good); text-align: right; }
    button {
      width: 100%; padding: 8px 12px; margin-top: 12px; cursor: pointer;
      background: var(--accent); color: #0b1224; border: 0; border-radius: 6px;
      font-weight: 600; font-size: 14px;
    }
    button.secondary { background: var(--panel-2); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px;
             background: var(--panel-2); color: var(--muted); margin-right: 4px; }
    .result-card { background: var(--panel-2); padding: 10px; border-radius: 6px; margin-bottom: 8px;
                   border-left: 4px solid transparent; cursor: pointer; transition: background 0.15s; }
    .result-card:hover { background: #475569; }
    .result-card.active { background: #475569; }
    .result-card .title { font-weight: 600; font-size: 13px; }
    .result-card .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .seg-list { font-size: 11px; margin-top: 6px; line-height: 1.5; }
    .seg-walk   { color: #fbbf24; }
    .seg-transit{ color: #38bdf8; }
    .seg-transfer{ color: #a78bfa; }
    details { background: var(--panel-2); border-radius: 6px; padding: 8px 10px; }
    details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
    .mode-toggle { display: flex; gap: 4px; margin-bottom: 8px; }
    .mode-toggle button { flex: 1; margin-top: 0; padding: 6px; font-size: 12px; }
    .mode-toggle button.active { background: var(--accent); color: #0b1224; }
    .mode-toggle button.inactive { background: var(--panel-2); color: var(--text); }
    .variant-card { background: var(--panel-2); padding: 8px; border-radius: 6px; margin-bottom: 6px;
                    border-left: 4px solid; }
    .variant-card input { width: 100%; }
    #status { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .footer { font-size: 11px; color: var(--muted); margin-top: 24px; padding-top: 8px;
              border-top: 1px solid #334155; }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Ayatori — Simulador</h1>
      <div id="health" class="badge">cargando...</div>

      <div class="mode-toggle">
        <button id="mode-single" class="active">Plan único</button>
        <button id="mode-compare" class="inactive">Comparar configs</button>
      </div>

      <h2>Origen / Destino</h2>
      <label>Origen (lat, lon)</label>
      <input id="origin" type="text" value="-33.4372, -70.6506" />
      <label>Destino (lat, lon)</label>
      <input id="destination" type="text" value="-33.4489, -70.6693" />
      <div id="status">Click izquierdo: origen · Click derecho: destino</div>

      <h2>Hora de salida</h2>
      <input id="departure" type="datetime-local" value="2023-09-04T08:00" />

      <h2>Búsqueda</h2>
      <div class="row">
        <div>
          <label>Alternativas</label>
          <input id="num_alternatives" type="number" min="1" max="10" value="5" />
        </div>
        <div>
          <label>Perfil</label>
          <select id="profile">
            <option value="balanced">balanced</option>
            <option value="fastest">fastest</option>
            <option value="fewer_transfers">fewer_transfers</option>
            <option value="less_walking">less_walking</option>
          </select>
        </div>
      </div>

      <div id="single-panel">
        <h2>Configuración CSA</h2>
        <div id="sliders"></div>
        <button id="btn-plan">Planificar</button>
        <button id="btn-reset" class="secondary">Restaurar defaults</button>
      </div>

      <div id="compare-panel" style="display:none">
        <h2>Variantes</h2>
        <div id="variants"></div>
        <button id="btn-add-variant" class="secondary">+ Agregar variante</button>
        <button id="btn-compare">Comparar</button>
      </div>

      <h2>Resultados</h2>
      <div id="results"></div>

      <div class="footer">
        Click una alternativa para resaltarla en el mapa.
      </div>
    </aside>
    <main>
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
