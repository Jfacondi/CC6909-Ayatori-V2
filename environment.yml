# Entorno conda para Ayatori V2 (GTFS + OSM + CSA).
#
# Pensado para Windows, donde `geopandas` y `pyrosm` (extra `geo` de
# pyproject.toml) se instalan de forma mucho más fiable desde conda-forge
# que con pip. Para reproducir solo con pip ver `requirements.txt`.
#
# Uso:
#   conda env create -f environment.yml
#   conda activate ayatori
#   pip install -e .          # instala el paquete ayatori en modo editable
name: ayatori
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  # Núcleo numérico / datos
  - numpy>=1.20
  - pandas>=1.3
  - scipy>=1.7
  # Grafos
  - rustworkx>=0.14
  - networkx>=2.6
  # Geo (motivo principal de usar conda en Windows)
  - geopandas
  - pyrosm
  - geopy>=2.2
  # GTFS
  - pygtfs>=0.1.9
  - python-dotenv>=0.19
  # Visualización
  - matplotlib>=3.4
  - seaborn>=0.11
  - folium>=0.12
  - plotly>=5.3
  # API
  - fastapi>=0.110
  - uvicorn>=0.27
  - httpx>=0.27
  # Notebooks de validación / rendimiento (Bloques 2 y 3)
  - jupyter
  - psutil
  # Dependencias solo-pip
  - pip:
      - -e .
