# Entorno conda para Ayatori V2 (GTFS + OSM + CSA).
#
# Desde que el ruteo OSM usa `osmium` (con wheel en Windows, vía el extra `geo`)
# en vez de `pyrosm` (conda-only), conda ya NO es necesario: basta
# `pip install -e .[api,geo]`. Este archivo se mantiene solo por comodidad.
# Para reproducir solo con pip ver `requirements.txt`.
#
# Uso:
#   conda env create -f environment.yml
#   conda activate ayatori
name: ayatori
channels:
  - conda-forge
dependencies:
  - python>=3.10,<3.13
  - pip
  # Núcleo + API + OSM, desde pyproject.toml
  - pip:
      - -e .[api,geo]
