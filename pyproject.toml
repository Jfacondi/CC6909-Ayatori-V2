[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayatori"
version = "0.2.0"
description = "Multimodal urban journey planner (GTFS + OSM + CSA)."
requires-python = ">=3.10"
authors = [{ name = "Felipe Leal" }]
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "rustworkx>=0.14",
    "networkx>=2.6",
    "geopy>=2.2",
    "pygtfs>=0.1.9",
    "python-dotenv>=0.19",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.4", "seaborn>=0.11", "folium>=0.12", "plotly>=5.3"]
geo = ["geopandas", "pyrosm"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27"]
dev = ["ruff>=0.4", "black>=24.0", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
ayatori-fetch-data = "ayatori.data.fetch:main"

[tool.setuptools.packages.find]
include = ["ayatori*", "api*"]

[tool.setuptools.package-data]
"ayatori.data" = ["manifest.toml"]
"api" = ["static/*"]

# ──────────────────────────────────────────────────────────────────────
# Tooling
# ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "notebooks", "ayatori.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"scripts/**" = ["B"]
"examples/**" = ["B"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "api.*"
disallow_untyped_defs = true
